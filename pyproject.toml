[build-system]
requires = ["scikit-build-core"]
build-backend = "scikit_build_core.build"

[tool.scikit-build]
cmake.source-dir = "native"
wheel.packages = ["src/crashs_cbstools_bindings"]

[tool.scikit-build.cmake.define]
# No default here: CMake is invoked from a temp build directory, so a relative default
# would resolve against the wrong working directory. CIBW_ENVIRONMENT_LINUX sets this to
# an absolute path in CI; for a local `pip install .` leave it unset and CMakeLists.txt
# falls back to `${CMAKE_CURRENT_SOURCE_DIR}/build` (i.e. native/build), which is
# always correct relative to the actual source tree.
CBSTOOLS_NATIVE_BUILD_DIR = {env = "CBSTOOLS_NATIVE_BUILD_DIR", default = ""}

[project]
name = "crashs-cbstools-bindings"
version = "0.1.0"
authors = [
  { name="Paul Yushkevich", email="pyushkevich@gmail.com" },
]
description = "GraalVM Native Image compiled Python bindings to select cbstools-public algorithms, used by CRASHS"
dependencies = [
  'numpy',
]
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Development Status :: 4 - Beta",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]

[project.urls]
Homepage = "https://github.com/pyushkevich/crashs-cbstools-bindings"
